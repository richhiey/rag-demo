[project]
name = "rag-lesson-demo"
version = "0.1.0"
description = "Small, source-linked RAG pipeline for the Masterschool lesson"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3",
  "langchain-chroma>=0.2",
  "langchain-core>=0.3",
  "langchain-groq>=0.2",
  "langchain-huggingface>=0.1",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.2",
  "beautifulsoup4>=4.12",
  "certifi>=2024.2.2",
  "pydantic>=2.7.4",
  "python-dotenv>=1.0",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
